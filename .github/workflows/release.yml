name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate version tag
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must look like v1.2.3 (got: $VERSION)" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build web bundle
        run: cd web && npm ci && npm run build

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/insteadly_${VERSION}_${goos}_${goarch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -tags webembed -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/insteadly
          done
          ( cd dist && sha256sum insteadly_* > checksums.txt )
          ls -lh dist

      - name: Smoke test linux/amd64 artifact
        run: |
          set -euo pipefail
          INSTEADLY_HTTP_ADDR=127.0.0.1:18080 \
          INSTEADLY_STORAGE_LOCAL_DIR="$RUNNER_TEMP/data" \
            "./dist/insteadly_${VERSION}_linux_amd64" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18080/healthz 2>/dev/null > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.1
          done
          jq -e --arg v "$VERSION" '.status == "ok" and .version == $v' "$RUNNER_TEMP/health.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$VERSION" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --generate-notes \
            "${extra[@]}"
