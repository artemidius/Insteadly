version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - nilerr
    - nolintlint
    - unconvert
    - wastedassign

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests may ignore cleanup errors and use plain http.NewRequest helpers.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
